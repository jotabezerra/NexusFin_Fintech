spring.application.name=nexusfin
spring.datasource.url=${DB_URL:jdbc:h2:mem:nexusfin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8080}
nexusfin.upload-dir=${UPLOAD_DIR:./data/comprovantes}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.demo.username=${DEMO_USERNAME:}
app.demo.password=${DEMO_PASSWORD:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
